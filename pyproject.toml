[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fetchMGs"
version = "2.1.3"
description = "FetchMGs extracts the 40 marker genes from genomes and metagenomes in an easy and accurate manner."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0" }
authors = [
    { name = "Hans-Joachim Ruscheweyh" },
    { name = "Chris Field" },
    { name = "Shinichi Sunagawa" },
    { name = "Daniel R. Mende" }
]
maintainers = [
    { name = "Hans-Joachim Ruscheweyh", email = "hansr@ethz.ch" }
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "biopython",
    "tqdm",
    "pyrodigal >= 3.6.3.post1",
    "pyhmmer ~= 0.12.0",
    "psutil"
]

[project.optional-dependencies]
dev = ["pytest", "tox"]

[project.urls]
Homepage = "https://github.com/motu-tool/FetchMGs"
Source = "https://github.com/motu-tool/FetchMGs"

[project.scripts]
fetchMGs = "fetchmgs.fetchmgs:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["fetchmgs"]

[tool.setuptools.package-data]
fetchmgs = ["data/*.hmm", "data/*.txt"]